name: Deploy frontend

# Bouwt en deployt de React frontend bij elke push naar main
# als er iets in App/ of in deze workflow zelf is veranderd.
on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - ".github/workflows/deploy-frontend.yml"
      - "docker-compose.yml"
  workflow_dispatch: # ook handmatig te starten via de Actions tab

env:
  # Docker Hub gebruikt geen registry-prefix in image namen.
  # Zorg dat IMAGE_NAME begint met je Docker Hub username.
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/project-vuur-frontend

jobs:
  # -------- Job 1: image bouwen en naar Docker Hub pushen --------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login bij Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags / metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build en push image
        uses: docker/build-push-action@v6
        with:
          context: ./App
          file: ./App/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------- Job 2: server SSH'en en compose herstarten --------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ~/vuur

            # Public Docker Hub image - geen login nodig op de server.
            # Nieuwste image binnenhalen en alleen de frontend herstarten.
            docker compose pull frontend
            docker compose up -d frontend

            # Oude dangling images opruimen om disk space te besparen.
            docker image prune -f
