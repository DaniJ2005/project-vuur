server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- API reverse proxy ---------------------------------------------------
    # Forward backend paths to the api container (Docker service name "api"
    # on its internal port 8080). Browser thinks it's talking to nginx.
    location /api/ {
        # GEEN trailing slash: het /api/ prefix wordt 1-op-1 doorgestuurd naar
        # de api container, omdat de ASP.NET routes ook met /api/ beginnen.
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Statische assets met een lange cache (Vite geeft ze een content hash).
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback: elke onbekende URL wordt afgehandeld door React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip aan voor wat snellere page loads.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
