server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Statische assets met een lange cache (Vite geeft ze een content hash).
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback: elke onbekende URL wordt afgehandeld door React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip aan voor wat snellere page loads.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
